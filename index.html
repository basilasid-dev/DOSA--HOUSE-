<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOSA HOUSE" />
  <meta name="theme-color" content="#1a0e07" />
  <link rel="manifest" href="/manifest.json" />
  <title>DOSA HOUSE - Cozy South Indian Cooking Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a0f08;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(212, 130, 10, 0.15), transparent 70%),
        radial-gradient(circle at 20% 80%, rgba(193, 92, 61, 0.1), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(62, 107, 72, 0.08), transparent 50%),
        linear-gradient(180deg, #1f120a 0%, #120904 100%);
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      outline: none;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }

    /* Loading overlay while web fonts and assets load */
    #initial-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #FFF8EE;
      font-family: 'Yatra One', cursive;
      font-size: 24px;
      letter-spacing: 2px;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(243, 167, 18, 0.2);
      border-top-color: #F3A712;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile portrait rotation prompt overlay */
    #rotate-device-prompt {
      display: none;
    }

    @media screen and (orientation: portrait) and (max-width: 960px) {
      #rotate-device-prompt {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 30%, #2a150a 0%, #120904 100%);
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        color: #FFF8EE;
        box-sizing: border-box;
      }

      .rotate-phone-anim {
        width: 64px;
        height: 64px;
        font-size: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: rotateDevice 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 22px;
      }

      .rotate-title {
        font-family: 'Yatra One', cursive;
        font-size: 22px;
        color: #F3A712;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }

      .rotate-subtitle {
        font-family: 'Outfit', sans-serif;
        font-size: 14.5px;
        color: #F2E4C9;
        max-width: 290px;
        line-height: 1.45;
        margin-bottom: 24px;
      }

      .rotate-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(243, 167, 18, 0.15);
        border: 1px solid rgba(243, 167, 18, 0.4);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        color: #FFC107;
        font-weight: 600;
      }

      @keyframes rotateDevice {
        0%, 15% { transform: rotate(0deg); }
        45%, 70% { transform: rotate(90deg); }
        90%, 100% { transform: rotate(0deg); }
      }
    }
  </style>
</head>
<body>
  <!-- Orientation prompt for smartphone users in portrait mode -->
  <div id="rotate-device-prompt">
    <div class="rotate-phone-anim">📱</div>
    <div class="rotate-title">ROTATE YOUR PHONE</div>
    <div class="rotate-subtitle">Turn to Landscape Mode for the authentic South Indian kitchen experience!</div>
    <div class="rotate-badge">🌿 Best in Landscape Mode 🔄</div>
  </div>

  <div id="game-container">
    <div id="initial-loader">
      <div class="spinner"></div>
      <div>HEATING UP THE TAWA...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
