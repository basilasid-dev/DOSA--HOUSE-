<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DOSA HOUSE - Cozy South Indian Cooking Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a0f08;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(212, 130, 10, 0.15), transparent 70%),
        radial-gradient(circle at 20% 80%, rgba(193, 92, 61, 0.1), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(62, 107, 72, 0.08), transparent 50%),
        linear-gradient(180deg, #1f120a 0%, #120904 100%);
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      outline: none;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }

    /* Loading overlay while web fonts and assets load */
    #initial-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #FFF8EE;
      font-family: 'Yatra One', cursive;
      font-size: 24px;
      letter-spacing: 2px;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(243, 167, 18, 0.2);
      border-top-color: #F3A712;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="initial-loader">
      <div class="spinner"></div>
      <div>HEATING UP THE TAWA...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
